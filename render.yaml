# Render blueprint: builds the nginx image from the Dockerfile and serves the mocked demo.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: react-admin-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: "80"
